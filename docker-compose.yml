services:
  redis:
    image: redis:7-alpine
    container_name: wibi-mcp-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis-data:/data
    # Solo red interna de Compose. NUNCA publicar 6379 al host/internet.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  wibi-mcp-gateway:
    build: .
    container_name: wibi-mcp-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      WIBI_HTTP_PORT: "3939"
      OAUTH_STORE: redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    # Solo accesible desde el host (Apache reverse proxy). No exponer a internet.
    ports:
      - "127.0.0.1:3939:3939"
    depends_on:
      redis:
        condition: service_healthy
    # Una sola réplica (Redis deja la puerta abierta a multi-réplica a futuro).
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3939/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis-data:
