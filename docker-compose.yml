services:
  wibi-mcp-gateway:
    build: .
    container_name: wibi-mcp-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      WIBI_HTTP_PORT: "3939"
    # Solo accesible desde el host (Apache reverse proxy). No exponer a internet.
    ports:
      - "127.0.0.1:3939:3939"
    # Una sola réplica: el estado OAuth/MCP vive en memoria del proceso.
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3939/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
